# Edge proxy: always online, shows maintenance page while app restarts,
# and proxies api.dikunova.art to the backend (bypasses *.supabase.co blocking for browsers in RF).

# Only Docker's embedded DNS: it knows the internal "app" service AND forwards
# public names (supabase.co, headquaters.space). Mixing in 8.8.8.8/1.1.1.1 made
# nginx randomly ask public DNS for "app" -> "app could not be resolved".
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 10s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---- Site: dikunova.art ----
# www -> main domain (one canonical host)
server {
  listen 8080;
  server_name www.dikunova.art;
  location = /__edge_health { access_log off; default_type text/plain; return 200 "ok"; }
  location / { return 301 https://dikunova.art$request_uri; }
}

server {
  listen 8080 default_server;
  server_name dikunova.art;
  client_max_body_size 200m;

  location = /__edge_health { access_log off; default_type text/plain; return 200 "ok"; }

  location = /maintenance.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
  }

  # Fonts and uploaded photos/videos live on Lovable's asset storage (/__l5e/...).
  # Off-platform the app cannot serve them, so fetch them from the Lovable-hosted copy.
  location /__l5e/ {
    set $assets_upstream dikunova.headquaters.space;
    proxy_pass https://$assets_upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name $assets_upstream;
    proxy_set_header Host $assets_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    if (-f /etc/nginx/flags/maintenance.enabled) { return 503; }
    set $app_upstream app:8080;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  error_page 502 503 504 = @maintenance;
  location @maintenance {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 900 always;
    rewrite ^ /maintenance.html break;
  }
}

# ---- Backend proxy: api.dikunova.art -> backend ----
server {
  listen 8080;
  server_name api.dikunova.art;
  client_max_body_size 200m;

  location = /__edge_health { access_log off; default_type text/plain; return 200 "ok"; }

  location / {
    set $supabase_upstream fzdhixryjteuofsofwnw.supabase.co;
    proxy_pass https://$supabase_upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name $supabase_upstream;
    proxy_set_header Host $supabase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
